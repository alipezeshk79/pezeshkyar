<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پزشک‌یار | مدیریت سفارش</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --p:#16a34a;--p2:#15803d;--p3:#4ade80;--ps:#ecfdf3;--pd:#14532d;
  --bg:#f6faf7;--sf:#ffffff;--sf2:#f3f8f4;--tx:#10231a;--mu:#5b7264;--ln:#e2eee6;
  --dang:#dc2626;--warn:#d97706;--ok:#16a34a;--sh:0 1px 2px rgba(16,80,45,.04),0 12px 32px rgba(16,80,45,.06);
  --inv:#fff;--invt:#111;--r:18px;
}
html.dark{
  --p:#4ade80;--p2:#86efac;--p3:#86efac;--ps:#12261b;--pd:#052e16;
  --bg:#080c0a;--sf:#101613;--sf2:#0c120f;--tx:#ecfdf5;--mu:#93ad9f;--ln:#1c2a22;
  --dang:#f87171;--warn:#fbbf24;--ok:#4ade80;--sh:0 1px 0 rgba(255,255,255,.03),0 16px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,Arial,sans-serif;min-height:100%}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--p2)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:52px;width:auto;max-width:160px;object-fit:contain;transition:filter .2s}
html.dark .brand img{filter:invert(1) brightness(1.2)}
html.dark .brand img{filter:invert(1) brightness(1.15)}
.brand-meta b{display:block;font-size:18px}
.ver{font-size:12px;color:var(--mu)}
.top-mid{display:flex;flex-direction:column;align-items:center}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:.06em;color:var(--p2)}
.shamsi{font-size:13px;color:var(--mu)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{border:1px solid var(--ln);background:var(--sf);color:var(--tx);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--p)}
.wrap{width:min(1180px,calc(100% - 28px));margin:18px auto 88px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:22px;font-weight:750}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dash-card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px 12px;box-shadow:none;text-align:center;transition:.2s transform,.2s border-color,.2s box-shadow;width:100%;height:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.dash-card:hover{transform:translateY(-2px);border-color:var(--p);box-shadow:var(--sh)}
.dash-ico{width:52px;height:52px;border-radius:16px;background:var(--ps);color:var(--p2);display:grid;place-items:center;font-size:24px;flex:none;margin:0 auto}
.dash-card .dash-txt{width:100%;text-align:center}
.dash-card h3{margin:0;font-size:13px;line-height:1.35;text-align:center}
.dash-card p{margin:4px 0 0;color:var(--mu);font-size:11px;line-height:1.35;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:17px;margin-top:4px;font-weight:750}
.stat span{color:var(--mu);font-size:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mu)}
.inp,select,textarea{width:100%;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);border-radius:12px;padding:10px 12px;outline:none}
.inp:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 20%,transparent)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:var(--ps);color:var(--pd);font-size:13px}
html.dark .btn{color:#ecfdf5}
.btn-p{background:var(--p);color:#fff}
.btn-d{background:color-mix(in srgb,var(--dang) 16%,var(--sf));color:var(--dang)}
.btn-g{background:transparent;border:1px solid var(--ln);color:var(--tx)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.search{position:relative}
.search .sug{position:absolute;inset-inline:0;top:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;max-height:240px;overflow:auto;z-index:30;display:none;box-shadow:var(--sh)}
.search .sug.open{display:block}
.search .sug div{padding:8px 12px;cursor:pointer}
.search .sug div:hover{background:var(--ps)}
.order-bar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.order-bar .grow{flex:1;min-width:200px}
.cust-block{width:100%}
.cust-ico{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--p2);display:grid;place-items:center;flex:none}
.cust-ico.on,.cust-ico:hover{border-color:var(--p);background:var(--ps)}
.cust-box{display:none;position:relative;margin:10px 0 4px;padding:14px;border:1px solid var(--p);border-radius:14px;background:var(--sf2)}
.cust-box.open{display:block}
.cust-box:before{content:"";position:absolute;top:-6px;inset-inline-start:16px;width:11px;height:11px;background:var(--sf2);border-inline-start:1px solid var(--p);border-top:1px solid var(--p);transform:rotate(45deg)}
.sel-hint{font-size:11px;color:var(--mu);margin-top:4px}
.note-box{margin-top:10px}
.note-box textarea{min-height:96px;resize:vertical;line-height:1.9;padding:10px 12px}
.note-box .sel-hint{display:block;margin-top:6px}
.pick-bar{display:flex;align-items:flex-end;gap:8px}
.pick-bar .grow{flex:1;min-width:0}
.pick-bar .cust-ico{margin-bottom:10px}
.sug .sug-empty{padding:10px 12px;color:var(--mu);cursor:default}
.unit-new{margin-top:6px}

.pf-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 auto 20px;direction:ltr;flex-wrap:wrap}
.pf-head-meta{direction:rtl;text-align:right;margin-left:auto}
.pf-head-meta h1{margin:0;font-size:25px;font-weight:800;letter-spacing:0}
.pf-head-meta p{margin:6px 0 0;font-size:13px;color:var(--mu)}
.pf-head-meta p.sub{color:var(--p);font-weight:700}
.pf-head > .btn, .pf-docs{direction:rtl}
.pf-docs{display:flex;gap:8px}
.pf-docs button{width:42px;height:42px;padding:0;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:20px;box-shadow:0 7px 15px color-mix(in srgb,var(--p) 35%,transparent)}
.pf-docs button:hover{transform:translateY(-2px);filter:brightness(.95)}
.portfolio-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:0;margin:0 0 18px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);background:var(--sf)}
.portfolio-stats>div{position:relative;padding:50px 12px 15px;text-align:center;border-inline-start:1px solid var(--ln);min-height:96px;transition:transform .25s ease,background .25s ease}
.portfolio-stats>div:first-child{border-inline-start:0}
.portfolio-stats>div:hover{transform:translateY(-5px);background:var(--sf2)}
.portfolio-stats>div:before{content:"◈";position:absolute;top:13px;left:50%;transform:translateX(-50%);color:var(--p);font-size:26px;line-height:1;text-shadow:0 5px 13px color-mix(in srgb,var(--p) 35%,transparent);animation:pfFloat 2.8s ease-in-out infinite}
.portfolio-stats>div:nth-child(2):before{content:"▦";animation-delay:.18s}
.portfolio-stats>div:nth-child(3):before{content:"◌";animation-delay:.36s}
.portfolio-stats>div:nth-child(4):before{content:"↗";animation-delay:.54s}
.portfolio-stats>div:nth-child(5):before{content:"◉";animation-delay:.72s}
.portfolio-stats>div:nth-child(6):before{content:"◷";animation-delay:.9s}
.portfolio-stats>div:nth-child(7):before{content:"◒";animation-delay:1.08s}
@keyframes pfFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.portfolio-stats small{display:block;color:var(--mu);font-size:11px;margin-bottom:7px}
.portfolio-stats b{display:block;font-size:16px;font-weight:800}
.portfolio-stats .debt b{color:var(--p2)}
html.dark .portfolio-stats{background:#132018;border-color:#1f3328}
html.dark .portfolio-stats>div{border-inline-start-color:#1f3328}
html.dark .portfolio-stats>div:hover{background:#173222}
.card h2,.card h3{margin:0 0 16px;font-size:17px;font-weight:800;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.card h2:before,.card h3:before{content:"";display:inline-block;width:5px;height:16px;background:var(--p);border-radius:8px;vertical-align:-3px;margin-left:9px}
.stage-box{padding:18px;border:1px solid color-mix(in srgb,var(--p) 28%,var(--ln));background:var(--ps);border-radius:14px}
.stage-box b{color:var(--pd);font-size:17px;display:block;margin-bottom:10px}
html.dark .stage-box b{color:var(--p3)}
.cart-table{width:100%;border-collapse:collapse;min-width:680px}
.cart-table th,.cart-table td{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:right;font-size:12px;vertical-align:middle}
.cart-table th{color:var(--mu);font-weight:650;background:var(--sf2)}
.cart-table tr:nth-child(even){background:color-mix(in srgb,var(--sf2) 65%,transparent)}
.cart-table tr.clickable:hover{background:color-mix(in srgb,var(--ps) 70%,transparent)}
.accounting-range{display:flex;gap:6px;margin:0 0 14px}
.accounting-range .chip{min-width:52px}
.cus-link{color:var(--p)!important;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.cus-link:hover{color:var(--p2)!important}
@media (max-width:700px){
  .portfolio-stats{grid-template-columns:1fr 1fr}
  .portfolio-stats>div{min-height:88px;padding:46px 8px 12px}
  .pf-head-meta h1{font-size:20px}
}

.pf-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pf-ava{width:52px;height:52px;border-radius:16px;background:var(--ps);color:var(--p2);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.pf-hero .pf-meta{flex:1;min-width:160px}
.pf-hero .pf-meta h1{margin:0 0 4px;font-size:22px}
.pf-hero .pf-meta p{margin:0;color:var(--mu);font-size:13px;line-height:1.6}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.kpi span{display:block;color:var(--mu);font-size:11px;margin-bottom:4px}
.kpi b{display:block;font-size:16px;font-weight:750}
.pf-list{display:flex;flex-direction:column;gap:8px}
.pf-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;cursor:pointer;text-align:right;width:100%;color:inherit}
.pf-item:hover{border-color:var(--p);background:color-mix(in srgb,var(--ps) 45%,var(--sf))}
.pf-item .grow{flex:1;min-width:0}
.pf-item .grow b{display:block;font-size:14px}
.pf-item .grow span{display:block;color:var(--mu);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-item .amt{font-size:13px;font-weight:750;white-space:nowrap}
.pf-item .acts{display:flex;gap:6px;flex:none}
.pf-item .acts .icon-btn{width:36px;height:36px;border-radius:10px}
.icon-btn.dang{color:var(--dang);border-color:color-mix(in srgb,var(--dang) 28%,var(--ln))}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper .chip{font-size:12px;font-weight:650;padding:6px 10px}
/* card titles styled with AXIS bar */
.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx)}
@media (max-width:900px){.kpi-row{grid-template-columns:1fr 1fr}}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:520px;margin:24px auto}
.hub-ico{background:var(--sf);border:1px solid var(--ln);border-radius:20px;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh);color:var(--tx);padding:16px 12px;text-align:center}
.hub-ico:hover{border-color:var(--p);transform:translateY(-3px)}
.hub-ico .mark{width:64px;height:64px;border-radius:18px;background:var(--ps);color:var(--p2);display:grid;place-items:center}
.hub-ico b{font-size:15px}
.hub-ico span{font-size:12px;color:var(--mu);text-align:center;line-height:1.5}
@media (max-width:700px){.hub{grid-template-columns:1fr;max-width:280px}}
.mat-note{font-size:11px;line-height:1.8;color:var(--mu);max-width:320px}
.mat-list{border:1px solid var(--ln);border-radius:14px;max-height:320px;overflow:auto;background:var(--sf2)}
.mat-row{display:grid;grid-template-columns:28px 1fr auto 90px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);margin:0;font-size:13px}
.bom-table{min-width:640px}
.bom-table .inp{min-height:40px;padding:8px 10px}
.bom-table tfoot td{font-weight:800;background:var(--sf2);border-top:2px solid var(--p)}
.bom-add{margin-top:10px}
.rep-bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding:10px 4px 0}
.rep-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.rep-stack{display:flex;align-items:flex-end;gap:3px;height:130px}
.rep-col .bar{width:13px;max-width:13px;background:var(--p);border-radius:5px 5px 0 0;min-height:2px;transition:height .25s ease}
.rep-col .bar.alt{background:color-mix(in srgb,var(--p) 40%,var(--sf2))}
.rep-col small{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.rep-legend{display:flex;gap:16px;font-size:11px;color:var(--mu);margin-top:12px;flex-wrap:wrap}
.rep-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--p);margin-left:6px}
.rep-legend i.alt{background:color-mix(in srgb,var(--p) 40%,var(--sf2))}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .set-meta{flex:1;min-width:170px}
.set-row .set-meta b{display:block;font-size:13px}
.set-row .set-meta span{display:block;color:var(--mu);font-size:11px;margin-top:3px;line-height:1.7}
.svc-table .inp{min-width:0}
.soc-empty{padding:22px;text-align:center;color:var(--mu)}
.card h2.h-row,.card h3.h-row{display:flex;align-items:center;gap:8px}
.card h2.h-row:before,.card h3.h-row:before{margin-left:0}
.h-row .spacer{flex:1;min-width:0}
.h-ico{width:32px;height:32px;padding:0;border-radius:10px;border:1px solid var(--ln);background:var(--ps);color:var(--p2);display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.h-ico:hover{background:var(--p);color:#fff;border-color:var(--p)}
.h-ico.lg{width:40px;height:40px;font-size:17px}
.pl-modal{width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column}
.pl-modal .table-wrap{flex:1;overflow:auto;min-height:120px}
.rep-a4{font-family:Vazirmatn,Tahoma,"B Nazanin","B Mitra",Arial,sans-serif}
.rep-a4 .kv td{font-size:12px;background:transparent !important}
.rep-a4 table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.rep-a4 th,.rep-a4 td{border:1px solid #111;padding:7px 9px;text-align:right;vertical-align:middle;background:#fff;line-height:1.7;font-size:12.5px}
.rep-a4 th{background:#f3f4f6;font-weight:800;text-align:center;font-size:12.5px}
.rep-a4 .c{text-align:center;font-variant-numeric:tabular-nums}
.rep-a4 .mat-cell{padding:5px 6px}
.rep-a4 .mat-sub{width:100%;border-collapse:collapse;font-size:11px}
.rep-a4 .mat-sub td{border:0;padding:2px 5px;text-align:right;background:transparent;line-height:1.9;font-size:11px}
.rep-a4 .mat-sub td.q{text-align:center;white-space:nowrap}
.rep-a4 .mat-sub td.a{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.rep-a4 .mat-none{color:#555;font-size:10px}
@media print{
  .rep-a4{page-break-after:always;page-break-inside:avoid}
  .rep-a4:last-child{page-break-after:auto}
  .rep-a4 thead{display:table-header-group}
  .rep-a4 tr{page-break-inside:avoid}
}
.pl-modal .pl-cb{width:18px;height:18px;accent-color:var(--p)}
.mat-row:last-child{border-bottom:0}
.pmeta{margin-top:8px;font-size:13px;color:var(--mu)}
.pmeta b{color:var(--tx)}
.table-wrap{overflow:auto;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:11px 12px;border-bottom:1px solid var(--ln);text-align:right;font-size:13px}
th{background:transparent;color:var(--mu);font-weight:650;font-size:11px}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:color-mix(in srgb,var(--ps) 55%,transparent)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;background:var(--ps);color:var(--pd);font-weight:700}
html.dark .badge{color:#ecfdf5}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.d{background:color-mix(in srgb,var(--dang) 16%,transparent);color:var(--dang)}
.badge.n{background:var(--sf2);color:var(--mu)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:7px 12px;font-weight:700}
.chip.on{background:var(--p);color:#052e16;border-color:var(--p)}
.statusbar{position:fixed;bottom:14px;inset-inline-end:14px;z-index:50;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:6px 10px;font-size:11px;box-shadow:var(--sh)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--dang)}
.dot.warn{background:var(--warn)}
.overlay,.modal-bg{position:fixed;inset:0;background:rgba(6,16,12,.55);display:none;place-items:center;z-index:80;padding:18px}
.overlay.show,.modal-bg.show{display:grid}
.modal{width:min(520px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.lock{display:none}
.lock.hide{display:none;pointer-events:none}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--ln);border-top-color:var(--p);animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toastbox{position:fixed;bottom:58px;left:14px;right:auto;z-index:100;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-start;max-width:min(360px,calc(100% - 28px))}
.toast{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;box-shadow:var(--sh);min-width:200px;text-align:right}
.empty{padding:28px;text-align:center;color:var(--mu)}
.qty{width:84px}
.a4-stage{background:#6b7280;padding:18px;border-radius:16px;overflow:auto}
.a4{width:210mm;min-height:297mm;background:#fff;color:#111;margin:0 auto 16px;padding:12mm 12mm 14mm;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.a4.land{width:297mm;height:210mm;min-height:210mm;padding:7mm 9mm 8mm;overflow:hidden}
.a4 *{color:#111;letter-spacing:0}
.a4 table{min-width:0}
.a4 th{background:#f3f4f6;color:#333}
.inv-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:6px}

const money = v => num(v).toLocaleString('en-US') + ' تومان';
const faDigits = s => String(s??'').replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* اعدادی که با فاصله گروه‌بندی شده‌اند (مثل شماره کارت) در پاراگراف راست‌به‌چپ
   گروه‌به‌گروه برعکس چیده می‌شوند؛ با isolate کردن LTR درست می‌شوند */

function saveCustomerFields(c, name, phone, address){
  if(!c){ toast('مشتری پیدا نشد', false); return false; }
  name=String(name||'').trim(); phone=String(phone||'').trim(); address=String(address||'').trim();
  if(!name || !phone){ toast('نام و شماره تماس لازم است', false); return false; }
  c.name=name; c.phone=phone; c.address=address;
  upsertLocal('customers', c);
  alive(DB.orders).filter(o=>String(o.customerId)===String(c.id)).forEach(o=>{
    o.customerName=name; o.customerPhone=phone; o.customerAddress=address; upsertLocal('orders', o);
  });
  flush();
  toast('اطلاعات مشتری ذخیره شد');
  return true;
}

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function g2j(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2 = gm>2 ? gy+1 : gy;
  let days = 355666 + 365*gy + ~~((gy2+3)/4) - ~~((gy2+99)/100) + ~~((gy2+399)/400) + gd + g_d_m[gm-1];
  let jy = -1595 + 33*~~(days/12053); days%=12053;
  jy += 4*~~(days/1461); days%=1461;
  if(days>365){ jy+=~~((days-1)/365); days=(days-1)%365; }
  const jm = days<186 ? 1+~~(days/31) : 7+~~((days-186)/30);
  const jd = 1 + (days<186 ? days%31 : (days-186)%30);
  return {jy,jm,jd};
}
function j2g(jy,jm,jd){
  jy+=1595;
  let days = -355668 + 365*jy + ~~(jy/33)*8 + ~~((jy%33+3)/4) + jd + (jm<7?(jm-1)*31:(jm-7)*30+186);
  let gy = 400*~~(days/146097); days%=146097;
  if(days>36524){ gy+=100*~~(--days/36524); days%=36524; if(days>=365) days++; }
  gy += 4*~~(days/1461); days%=1461;
  if(days>365){ gy+=~~((days-1)/365); days=(days-1)%365; }
  let gd=days+1, sal_a=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31], gm=0;
  for(gm=1;gm<=12&&gd>sal_a[gm];gm++) gd-=sal_a[gm];
  return {gy,gm,gd};
}
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JW=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function shamsiStr(d=new Date()){
  const j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${JW[d.getDay()]} ${j.jd} ${JM[j.jm-1]} ${j.jy}`;
}
function shamsiShort(d=new Date()){
  const j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')}`;
}
function parseShamsi(s){
  const m=String(s||'').match(/(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return new Date();
  const g=j2g(+m[1],+m[2],+m[3]);
  return new Date(g.gy,g.gm-1,g.gd);
}

/* افزودن نسخه به نشانی لوگو تا نسخهٔ قدیمی از حافظهٔ مرورگر نیاید */
function logoUrl(f){
  const v=String(APP.version||'1').replace(/[^0-9.]/g,'').replace(/^\.+/,'');
  return f+'?v='+v;
}
function normShamsi(v){
  const s=String(v==null?'':v).trim();
  const m=s.match(/^(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return '';
  return m[1]+'/'+String(m[2]).padStart(2,'0')+'/'+String(m[3]).padStart(2,'0');
}
function shamsiOf(rec){
  if(!rec) return '';
  const v=normShamsi(rec.dateShamsi);
  if(v) return v;
  const g=new Date(rec.dateGregorian||'');
  if(!isNaN(g.getTime())) return shamsiShort(g);
  return String(rec.dateShamsi||'').split('T')[0].replace(/-/g,'/');
}
function repairDates(){
  let fixed=0;
  ['orders','payments','purchases','socialOrders'].forEach(k=>{
    (DB[k]||[]).forEach(r=>{
      if(!r || String(r.deleted)==='1' || !r.dateShamsi) return;
      const v=normShamsi(r.dateShamsi);
      if(v && v!==String(r.dateShamsi)){ r.dateShamsi=v; dirty[k].add(String(r.id)); fixed++; }
    });
  });
  if(fixed){ persistLocal(); flush(); }
  return fixed;
}
function toast(msg, ok=true){
  const el=document.createElement('div');
  el.className='toast';
  el.style.borderColor = ok ? 'var(--p)' : 'var(--dang)';
  el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

    $('#cNo').onclick=()=>{m.className='modal-bg';res(false)};
    $('#cYes').onclick=()=>{m.className='modal-bg';res(true)};
  });
}
function priceAlert(info){
  return new Promise(res=>{
    const m=$('#modal');
    m.className='modal-bg show';
    m.innerHTML=`<div class="modal" style="width:min(520px,100%)">
      <h3 style="margin:0 0 8px">افزایش قیمت مواد اولیه</h3>
      <p>هزینه تمام‌شده این کالا بالا رفته است.</p>
      <div class="stats">
        <div class="stat"><span>هزینه تمام‌شده قبلی</span><b>${money(info.oldCost)}</b></div>
        <div class="stat"><span>هزینه تمام‌شده جدید</span><b>${money(info.newCost)}</b></div>
        <div class="stat"><span>درصد سود سابق</span><b>${pctTxt(info.profitPct)}</b></div>
        <div class="stat"><span>قیمت پیشنهادی</span><b>${money(info.suggested)}</b></div>
      </div>
      <div class="field" style="margin-top:12px"><label>قیمت جدید فروش</label><input class="inp" id="paPrice" type="number" value="${info.suggested}"></div>
      <div class="row-actions" style="justify-content:flex-end;margin-top:14px">
        <button class="btn btn-g" id="paOld">ثبت با قیمت قبلی (${money(info.oldPrice)})</button>
        <button class="btn btn-p" id="paNew">ثبت با قیمت جدید</button>
      </div>
    </div>`;
    $('#paOld').onclick=()=>{ m.className='modal-bg'; res({keepOld:true, price:info.oldPrice}); };
    $('#paNew').onclick=()=>{
      const pr=num($('#paPrice').value);
      if(!pr){ toast('قیمت جدید را وارد کنید',false); return; }
      m.className='modal-bg'; res({keepOld:false, price:pr});
    };
  });
}
async function resolveSalePrice(p, typedPrice){
  const oldCost=num(p.materialCost);
  const newCost=productCost(p);
  const oldPrice=productSale(p);
  const typed=num(typedPrice);
  const basePrice=typed||oldPrice;
  if(!(oldCost>0 && newCost>oldCost+0.5)) return {price:basePrice, cost:newCost};
  const pct=productProfitPct(p, oldCost);
  const suggested=Math.round(newCost*(1+pct/100));
  const ans=await priceAlert({oldCost,newCost,profitPct:pct,oldPrice:basePrice,suggested});
  if(!ans.keepOld){
    snapshotProduct(p, ans.price, newCost);
    upsertLocal('products', p);
  }
  return {price:ans.price, cost:newCost};
}

function persistLocal(){
  try{
    localStorage.setItem('py_db', JSON.stringify(DB));
    const d={};
    KEYS.forEach(k=>d[k]=[...dirty[k]]);
    localStorage.setItem('py_dirty', JSON.stringify(d));
    queueCount = KEYS.reduce((a,k)=>a+dirty[k].size,0);
  }catch(e){}
}

async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function api(action, payload={}, ms=20000, tries=1){
  let lastErr=null;
  for(let attempt=0; attempt<=tries; attempt++){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), ms);
    try{
      const res=await fetch(APP.SCRIPT_URL,{
        method:'POST', redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action, token:APP.APP_TOKEN, ...payload}),
        signal: ctrl.signal
      });
      if(!res.ok) throw new Error('خطای شبکه '+res.status);
      const txt=await res.text();
      let json;
      try{ json=JSON.parse(txt); }
      catch(e){ throw new Error('پاسخ نامعتبر از سرور'); }
      return json;
    }catch(e){
      lastErr = (e && e.name==='AbortError') ? new Error('زمان درخواست به پایان رسید') : (e instanceof Error ? e : new Error(String(e)));
      if(attempt<tries) await sleep(1200*(attempt+1));
    }finally{ clearTimeout(timer); }
  }
  throw lastErr;
}

async function bootstrap(){
  const data=await api('bootstrap', {}, 30000, 1);
  if(!data.ok) throw new Error(data.error||'بازیابی ناموفق');
  if(!data.data) throw new Error('پاسخ بازیابی ناقص است');
  KEYS.forEach(k=>{
    if(!Array.isArray(data.data[k])) return;
    const map=new Map(data.data[k].map(r=>[String(r.id), r]));
    (DB[k]||[]).forEach(r=>{
      if(dirty[k] && dirty[k].has(String(r.id))) map.set(String(r.id), r);
    });
    DB[k]=[...map.values()];
  });
  const prevSvc=DB.settings && DB.settings.serviceNames;
  const prevUnits=DB.settings && DB.settings.unitNames;
  DB.settings = Object.assign({invoiceCounter:invoiceStart()}, data.data.settings||{});
  try{
    const a=parseJsonArr(prevSvc);
    const b=parseJsonArr(DB.settings.serviceNames);
    DB.settings.serviceNames=JSON.stringify(mergeSvcLists(a,b));
  }catch(e){ if(prevSvc && !DB.settings.serviceNames) DB.settings.serviceNames=prevSvc; }
  try{
    const a=parseJsonArr(prevUnits);
    const b=parseJsonArr(DB.settings.unitNames);
    DB.settings.unitNames=JSON.stringify([...new Set([...a,...b].map(s=>String(s||'').trim()).filter(Boolean))]);
  }catch(e){ if(prevUnits && !DB.settings.unitNames) DB.settings.unitNames=prevUnits; }
  lastSync=new Date(); lastError='';
  persistLocal();
}

const SYNC_CHUNK=40;
function syncQueue(){
  const q=[];
  KEYS.forEach(k=>{
    if(!dirty[k] || !dirty[k].size) return;
    const recs=DB[k].filter(r=>dirty[k].has(String(r.id)));
    if(recs.length) q.push({key:k, recs});
  });
  return q;
}
async function flush(force){
  if(syncing || !navigator.onLine) return;
  const q=syncQueue();
  const total=q.reduce((n,x)=>n+x.recs.length,0);
  if(!total && !settingsDirty && !force) return;
  syncing=true; syncDone=0; syncTotal=total; renderStatus();
  let settingsSent=false;
  try{
    for(const part of q){
      for(let i=0;i<part.recs.length;i+=SYNC_CHUNK){
        const slice=part.recs.slice(i, i+SYNC_CHUNK);
        const collections={}; collections[part.key]=slice;
        const r=await api('sync',{collections, settings:DB.settings}, 120000, 0);
        if(!r || !r.ok) throw new Error((r&&r.error)||'ذخیره ناموفق');
        slice.forEach(rec=>dirty[part.key].delete(String(rec.id)));
        syncDone+=slice.length;
        settingsSent=true; settingsDirty=false;
        persistLocal(); renderStatus();
      }
    }
    if(!settingsSent && settingsDirty){
      const r=await api('sync',{collections:{}, settings:DB.settings}, 60000, 0);
      if(!r || !r.ok) throw new Error((r&&r.error)||'ذخیره تنظیمات ناموفق');
      settingsDirty=false;
    }
    lastSync=new Date(); lastError='';
    persistLocal();
  }catch(e){
    lastError=e && e.message ? e.message : 'خطای بکاپ';
  }finally{
    syncing=false; syncDone=0; syncTotal=0; renderStatus();
  }
}
async function fullSync(){
  KEYS.forEach(k=>DB[k].forEach(r=>{ if(r && r.id) dirty[k].add(String(r.id)); }));
  settingsDirty=true; persistLocal();
  await flush(true);
}

  return n;
}

function detectPlatform(){
  const ua=navigator.userAgent||'';
  const plat=navigator.platform||'';
  const touch=('ontouchstart' in window) || navigator.maxTouchPoints>0;
  const narrow=Math.min(window.innerWidth||999, screen.width||999)<820;
  const uaMob=/Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry/i.test(ua);
  const mobile=uaMob || (touch && narrow);
  let os='other';
  if(/iPhone|iPad|iPod/i.test(ua) || (plat==='MacIntel' && navigator.maxTouchPoints>1)) os='ios';
  else if(/Android/i.test(ua)) os='android';
  else if(/Windows Phone/i.test(ua)) os='android';
  else if(/Win/i.test(plat)||/Windows/i.test(ua)) os='windows';
  else if(/Mac/i.test(plat)||/Mac OS/i.test(ua)) os='mac';
  else if(/Linux/i.test(ua)) os='linux';
  const root=document.documentElement;
  root.classList.toggle('is-mobile', !!mobile);
  root.classList.toggle('is-touch', !!touch);
  ['ios','android','windows','mac','linux','other'].forEach(x=>root.classList.remove('os-'+x));
  root.classList.add('os-'+os);
  document.body.dataset.os=os;
  const lab={ios:'iOS · آیفون/آیپد',android:'اندروید',windows:'ویندوز',mac:'مک',linux:'لینوکس',other:'دستگاه'}[os];
  const badge=$('#osBadge');
  if(badge) badge.textContent=lab+(mobile?' · موبایل':' · دسکتاپ');
  const tc=$('#themeColor');
  if(tc) tc.setAttribute('content', root.classList.contains('dark')?'#0a0f0d':'#22c55e');
  return {os, mobile, touch};
}

function productCost(p){
  if(!p) return 0;
  const bom=alive(DB.productMaterials).filter(b=>b.productId===p.id);
  if(bom.length){
    return bom.reduce((s,b)=>{
      const m=byId(DB.materials,b.materialId);
      return s + num(m&&m.unitCost)*num(b.qty);
    },0);
  }
  return num(p.materialCost);
}
function nextProductCode(){
  let n=num(APP.PRODUCT_CODE_START)||311;
  alive(DB.products).forEach(p=>{
    const s=String(p.code||'').trim();
    if(!/^\d{3,4}$/.test(s)) return;
    const x=num(s);
    if(x>=n) n=x+1;
  });
  return String(n);
}
function productSale(p){
  if(!p) return 0;
  return num(p.salePrice) || num(p.priceTier1);
}
function productProfitPct(p, cost){
  const c = cost!=null ? num(cost) : productCost(p);
  const s = productSale(p);
  if(c>0) return ((s-c)/c)*100;
  return num(p&&p.profitPct);
}
function pctTxt(v){
  const n=num(v);
  if(!isFinite(n)) return '۰٪';
  return (Math.round(n*10)/10).toLocaleString('fa-IR') + '٪';
}
function snapshotProduct(p, sale, cost){
  p.salePrice=num(sale);
  p.priceTier1=num(sale);
  p.priceTier2=0; p.priceTier3=0;
  p.materialCost=num(cost);
  p.profitPct = cost>0 ? ((sale-cost)/cost)*100 : 0;
  return p;
}
function orderItems(oid){ return alive(DB.orderItems).filter(i=>i.orderId===oid); }
function totalsOf(oid){
  const items=orderItems(oid);
  const totalSale=items.reduce((s,i)=>s+num(i.saleAmount),0);
  const totalMaterial=items.reduce((s,i)=>s+num(i.materialCost)*num(i.qty),0);
  return {totalSale,totalMaterial,totalProfit:totalSale-totalMaterial,count:items.length};
}
function orderFinancials(o){
  if(!o) return {sale:0, material:0, profit:0};
  if(num(o.totalSale)>0) return {sale:num(o.totalSale), material:num(o.totalMaterial), profit:num(o.totalProfit)};
  const t=totalsOf(o.id);
  return {sale:num(t.totalSale), material:num(t.totalMaterial), profit:num(t.totalProfit)};
}
function refreshOrderTotals(order){
  const t=totalsOf(order.id);
  order.totalSale=t.totalSale; order.totalMaterial=t.totalMaterial; order.totalProfit=t.totalProfit;
  return order;
}
function ledger(cid){
  const orders=alive(DB.orders).filter(o=>o.customerId===cid)
    .sort((a,b)=>String(a.dateGregorian).localeCompare(String(b.dateGregorian))||num(a.invoiceNo)-num(b.invoiceNo));
  const pays=alive(DB.payments).filter(p=>p.customerId===cid)
    .sort((a,b)=>String(a.dateGregorian).localeCompare(String(b.dateGregorian))||String(a.createdAt).localeCompare(String(b.createdAt)));
  const rows=orders.map(o=>{ const f=orderFinancials(o); return {order:o, sale:f.sale, paid:0, bal:f.sale}; });
  pays.forEach(p=>{
    let left=num(p.amount);
    rows.forEach(r=>{
      if(left<=0) return;
      const take=Math.min(left,r.bal);
      r.paid+=take; r.bal=Math.round((r.bal-take)*100)/100; left-=take;
    });
  });
  const totalSale=rows.reduce((s,r)=>s+r.sale,0);
  const totalPaid=pays.reduce((s,p)=>s+num(p.amount),0);
  const debt=rows.reduce((s,r)=>s+r.bal,0);
  return {orders:rows, pays, totalSale, totalPaid, debt};
}
function applySettleFlags(cid){
  const L=ledger(cid);
  L.orders.forEach(r=>{
    const o=r.order;
    if(r.bal<=0.5 && num(o.totalSale)>0){
      if(o.status!=='تسویه شده'){ o.status='تسویه شده'; upsertLocal('orders',o); }
    }else if(o.status==='تسویه شده'){
      o.status = num(o.stage)>=4 ? 'تحویل داده شده' : 'آماده‌سازی';
      upsertLocal('orders',o);
    }
  });
}

    a.href=url; a.download=name; a.style.display='none';

function bindNewOrder(){
  const fillCustomer = c => {
    draft.customerId=c.id; draft.customerName=c.name; draft.customerPhone=c.phone; draft.customerAddress=c.address||'';
    $('#cName').value=c.name||''; $('#cPhone').value=c.phone||''; $('#cAddr').value=c.address||'';
    $('#cSearch').value = `${c.name||''}${c.phone?' — '+c.phone:''}`;
  };
  const openList = (box, items, htmlFn, onPick) => {
    box.classList.toggle('open', !!items.length);
    box.innerHTML = items.length ? items.map(htmlFn).join('') : '<div class="muted">موردی یافت نشد</div>';
    if(!items.length) box.classList.add('open');
    [...box.children].forEach((el,i)=>{
      if(!items[i]) return;
      el.onclick=()=>{ onPick(items[i]); box.classList.remove('open'); };
    });
  };
  const showCustomers = q => openList($('#cSug'), customerSuggest(q),
    c=>`<div>${esc(c.name)} — ${esc(c.phone)}</div>`,
    c=>fillCustomer(c)
  );
  $('#cSearch').addEventListener('focus', e=>showCustomers(e.target.value.includes(' — ')?'':e.target.value));
  $('#cSearch').addEventListener('input', e=>showCustomers(e.target.value));
  let picked=null;
  const fillPrice=()=>{
    if(!picked) return;
    const cost=productCost(picked);
    const sale=productSale(picked);
    $('#pPrice').value = sale || '';
    if($('#pMeta')) $('#pMeta').innerHTML=`قیمت تمام‌شده: <b>${money(cost)}</b> — درصد سود: <b>${pctTxt(productProfitPct(picked,cost))}</b>`;
  };
  const showProducts = q => openList($('#pSug'), productSuggest(q),
    p=>`<div>${esc(p.code)} — ${esc(p.name)}</div>`,
    p=>{ picked=p; $('#pId').value=p.id; $('#pSearch').value=p.name; fillPrice(); }
  );
  $('#pSearch').addEventListener('focus', e=>showProducts(e.target.value));
  $('#pSearch').addEventListener('input', e=>showProducts(e.target.value));
  const closePanels = except => {
    [['cusBox','togCust'],['newCusBox','togNewCus'],['newPrBox','togNewPr']].forEach(([box,btn])=>{
      if(except===box) return;
      const b=$( '#'+box), i=$('#'+btn);
      if(b) b.classList.remove('open');
      if(i) i.classList.remove('on');
    });
  };
  $('#togCust').onclick=()=>{
    const open=$('#cusBox').classList.toggle('open');
    $('#togCust').classList.toggle('on', open);
    if(open) closePanels('cusBox');
  };
  $('#togNewCus').onclick=()=>{
    const open=$('#newCusBox').classList.toggle('open');
    $('#togNewCus').classList.toggle('on', open);
    if(open) closePanels('newCusBox');
  };
  $('#togNewPr').onclick=()=>{
    const open=$('#newPrBox').classList.toggle('open');
    $('#togNewPr').classList.toggle('on', open);
    if(open) closePanels('newPrBox');
    bindUnitSelects($('#newPrBox'));
  };
  bindUnitSelects($('#newPrBox'));
  $('#saveNewCus').onclick=()=>{
    const name=$('#ncName').value.trim(), phone=$('#ncPhone').value.trim();
    if(!name||!phone){ toast('نام و شماره تماس مشتری لازم است',false); return; }
    const c={id:uid('cus'),name,phone,address:$('#ncAddr').value.trim(),deleted:'0'};
    upsertLocal('customers',c);
    fillCustomer(c);
    $('#newCusBox').classList.remove('open');
    $('#togNewCus').classList.remove('on');
    toast('مشتری جدید ذخیره شد');
  };
  $('#saveNewPr').onclick=()=>{
    const name=$('#npName').value.trim();
    const cost=num($('#npCost').value);
    if(!name){ toast('نام محصول لازم است',false); return; }
    if(!cost){ toast('قیمت تمام‌شده را وارد کنید',false); return; }
    const rec=snapshotProduct({id:uid('prd'),code:nextProductCode(),name,category:defCategory(),unit:'',notes:'',deleted:'0'}, cost, cost);
    upsertLocal('products',rec);
    picked=rec;
    $('#pId').value=rec.id;
    $('#pSearch').value=rec.name;
    $('#pPrice').value=cost;
    $('#newPrBox').classList.remove('open');
    $('#togNewPr').classList.remove('on');
    toast('محصول جدید ذخیره شد');
  };
  const grabDraft=()=>{
    draft.customerName=$('#cName').value.trim();
    draft.customerPhone=$('#cPhone').value.trim();
    draft.customerAddress=$('#cAddr').value.trim();
    draft.dateShamsi=$('#cDate').value.trim();
    draft.notes=$('#oNotes').value.trim();
    draft.dateGregorian=parseShamsi(draft.dateShamsi).toISOString();
    if(!draft.customerName){
      const raw=($('#cSearch').value||'').split('—')[0].trim();
      if(raw) draft.customerName=raw;
    }
  };
  const notesEl=$('#oNotes');
  if(notesEl) notesEl.oninput=()=>{ if(draft) draft.notes=notesEl.value; };
  $('#addItem').onclick=async()=>{
    if(!picked){ toast('ابتدا محصول را انتخاب کنید',false); return; }
    const qty=Math.max(1,num($('#pQty').value));
    const decided=await resolveSalePrice(picked, $('#pPrice').value);
    const price=decided.price;
    const mc=decided.cost;
    const sale=qty*price;
    draft.items.push({
      id:uid('oit'), productId:picked.id, productCode:picked.code, productName:picked.name,
      qty, producedQty:0, priceTier:'', unitPrice:price, unit:picked.unit||'عدد',
      materialCost:mc, saleAmount:sale, profit:sale-mc*qty
    });
    grabDraft(); render();
  };
  $$('[data-edit-qty]').forEach(inp=>inp.onchange=()=>{
    const it=draft.items[+inp.dataset.editQty];
    it.qty=Math.max(1,num(inp.value));
    it.saleAmount=it.qty*num(it.unitPrice);
    it.profit=it.saleAmount-num(it.materialCost)*it.qty;
    grabDraft(); render();
  });
  $$('[data-del-item]').forEach(btn=>btn.onclick=async()=>{
    if(await confirmBox('حذف محصول','این کالا از لیست سفارش حذف شود؟')){
      draft.items.splice(+btn.dataset.delItem,1); grabDraft(); render();
    }
  });
  $('#saveOrder').onclick=()=>saveDraft(false);
  $('#previewInv').onclick=()=>saveDraft(true);
}

async function saveDraft(openInv){
  draft.customerName=$('#cName').value.trim();
  draft.customerPhone=$('#cPhone').value.trim();
  draft.customerAddress=$('#cAddr').value.trim();
  draft.dateShamsi=$('#cDate').value.trim();
  draft.notes=$('#oNotes').value.trim();
  draft.dateGregorian=parseShamsi(draft.dateShamsi).toISOString();
  if(!draft.customerName || !draft.customerPhone){ toast('نام و شماره مشتری الزامی است',false); return; }
  if(!draft.items.length){ toast('حداقل یک محصول اضافه کنید',false); return; }
  for(const it of draft.items){
    const p=byId(DB.products,it.productId);
    if(!p) continue;
    const decided=await resolveSalePrice(p, it.unitPrice);
    it.unitPrice=decided.price;
    it.materialCost=decided.cost;
    it.saleAmount=num(it.qty)*decided.price;
    it.profit=it.saleAmount-decided.cost*num(it.qty);
  }
  if(!draft.customerId){
    const exist=alive(DB.customers).find(c=>c.phone===draft.customerPhone);
    if(exist) draft.customerId=exist.id;
    else{
      const c={id:uid('cus'), name:draft.customerName, phone:draft.customerPhone, address:draft.customerAddress, deleted:'0'};
      upsertLocal('customers',c); draft.customerId=c.id;
    }
  }else{
    const c=byId(DB.customers,draft.customerId);
    if(c){ c.name=draft.customerName; c.phone=draft.customerPhone; c.address=draft.customerAddress; upsertLocal('customers',c); }
  }
  if(!num(draft.invoiceNo)) draft.invoiceNo = await nextInvoice();
  const order={
    id:draft.id, invoiceNo:draft.invoiceNo, customerId:draft.customerId,
    customerName:draft.customerName, customerPhone:draft.customerPhone, customerAddress:draft.customerAddress,
    dateShamsi:draft.dateShamsi, dateGregorian:draft.dateGregorian, notes:draft.notes,
    stage:1, status:'آماده‌سازی', trackingCode:'', deleted:'0'
  };
  draft.items.forEach(it=>{
    upsertLocal('orderItems', Object.assign({},it,{orderId:order.id, deleted:'0'}));
  });
  refreshOrderTotals(order);
  upsertLocal('orders', order);
  applySettleFlags(order.customerId);
  const savedId=order.id;
  draft=null;
  toast('سفارش ذخیره شد');
  flush();
    if(openInv) showInvoice(savedId);
  else go('order', savedId);
}

  const items=orderItems(o.id);
  const done=items.filter(i=>num(i.producedQty)>=num(i.qty)).length;
  const remain=items.reduce((s,i)=>s+Math.max(0,num(i.qty)-num(i.producedQty)),0);
  const qtySum=items.reduce((s,i)=>s+num(i.qty),0);
  const rows=items.map(it=>{
    const left=Math.max(0,num(it.qty)-num(it.producedQty||0));
    return `<tr>
      <td>${esc(it.productCode)}</td>

  return `

    <button class="btn btn-g" data-go="orders">← مدیریت سفارش‌ها</button>

      <button type="button" id="addToOrder" title="افزودن محصول">＋</button>

function bindOrder(o){
  $$('[data-ren]').forEach(inp=>inp.onchange=()=>{
    const it=byId(DB.orderItems,inp.dataset.ren); it.productName=inp.value; upsertLocal('orderItems',it); toast('نام کالا در این سفارش تغییر کرد');
  });
  $$('[data-oqty]').forEach(inp=>inp.onchange=()=>{
    const it=byId(DB.orderItems,inp.dataset.oqty);
    it.qty=Math.max(1,num(inp.value)); it.saleAmount=it.qty*num(it.unitPrice); it.profit=it.saleAmount-num(it.materialCost)*it.qty;
    upsertLocal('orderItems',it); refreshOrderTotals(o); upsertLocal('orders',o); applySettleFlags(o.customerId); render();
  });
  $$('[data-prod]').forEach(inp=>inp.onchange=()=>{
    const it=byId(DB.orderItems,inp.dataset.prod); it.producedQty=Math.max(0,num(inp.value)); upsertLocal('orderItems',it); toast('تعداد تولید ذخیره شد');
  });
  $$('[data-del-oi]').forEach(btn=>btn.onclick=async()=>{
    if(!await confirmBox('حذف کالا','این محصول از سفارش حذف شود؟')) return;
    const it=byId(DB.orderItems,btn.dataset.delOi); it.deleted='1'; upsertLocal('orderItems',it);
    refreshOrderTotals(o); upsertLocal('orders',o); render();
  });
  $$('[data-stage]').forEach(btn=>btn.onclick=async()=>{
    const s=Number(btn.dataset.stage);
    if(s<Number(o.stage)){ toast('مرحله فقط به‌ترتیب جلو می‌رود',false); return; }
    if(s===4){
      const code=$('#trk').value.trim();
      if(!code){ toast('برای تحویل، کد پیگیری را وارد کنید',false); return; }
      o.trackingCode=code;
    }
    o.stage=s;
    if(s>=4 && o.status!=='تسویه شده') o.status='تحویل داده شده';
    upsertLocal('orders',o); toast('مرحله سفارش به‌روز شد'); render();
  });
  if($('#trk')) $('#trk').onchange=()=>{ o.trackingCode=$('#trk').value.trim(); upsertLocal('orders',o); };
  if($('#addToOrder')) $('#addToOrder').onclick=()=>openAddProduct(o);
}

function bomRowHTML(mId, qty){
  const mats=alive(DB.materials);
  const m=mId?byId(DB.materials,mId):null;
  const q=(qty==null||qty==='')?1:qty;
  const opts=['<option value="">— انتخاب ماده اولیه —</option>'].concat(
    mats.map(x=>`<option value="${x.id}" ${m&&String(x.id)===String(m.id)?'selected':''}>${esc(x.name)}</option>`)
  ).join('');
  const price=m?num(m.unitCost):0;
  const line=price*num(q);
  return `<tr class="bom-row">
    <td><select class="inp bom-mat">${opts}</select></td>
    <td><input class="inp bom-qty" type="number" min="0" step="0.01" value="${q}"></td>
    <td class="bom-unit">${m?esc(m.unit||''):'—'}</td>

const BASE_UNITS=['عدد','کیلوگرم','گرم','متر','سانتی‌متر','لیتر','بسته','کارتن','جفت','رول','ورق','متر مربع','دست','شانه','جعبه'];
function parseJsonArr(raw){
  try{ const v=JSON.parse(raw||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; }
}
function normalizeSvcList(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(x=>{
    if(typeof x==='string') return {name:String(x).trim(), unit:'عدد', price:0, note:''};
    return {name:String(x&&x.name||'').trim(), unit:String(x&&x.unit||'عدد').trim()||'عدد',
            price:num(x&&x.price), note:String(x&&x.note||'')};
  }).filter(x=>x.name);
}
function mergeSvcLists(a,b){
  const map=new Map();
  [...normalizeSvcList(a), ...normalizeSvcList(b)].forEach(s=>{
    const prev=map.get(s.name);
    if(!prev){ map.set(s.name, s); return; }
    map.set(s.name, {
      name:s.name,
      unit:(s.unit && s.unit!=='عدد') ? s.unit : (prev.unit||'عدد'),
      price:num(s.price)||num(prev.price),
      note:s.note || prev.note || ''
    });
  });
  return [...map.values()];
}
function serviceCatalog(){
  const map=new Map();
  normalizeSvcList(parseJsonArr(DB.settings.serviceNames)).forEach(s=>map.set(s.name,s));
  alive(DB.purchases).filter(p=>p.kind==='service').forEach(p=>{
    const name=String(p.title||'').trim();
    if(!name) return;
    const unit=String(p.unit||'').trim();
    const prev=map.get(name);
    if(!prev) map.set(name,{name, unit:unit||'عدد'});
    else if(unit) map.set(name,{name, unit});
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fa'));
}
function addServiceToCatalog(name, unit){
  name=String(name||'').trim();
  if(!name) return '';
  if(!name.startsWith('خدمات')) name='خدمات '+name;
  unit=rememberUnit(unit||'عدد');
  const list=normalizeSvcList(parseJsonArr(DB.settings.serviceNames));
  const i=list.findIndex(x=>x.name===name);
  if(i>=0){ if(unit) list[i].unit=unit; }
  else list.push({name, unit});
  DB.settings.serviceNames=JSON.stringify(list);
  settingsDirty=true;
  persistLocal();
  return name;
}
function knownUnits(){
  const extra=parseJsonArr(DB.settings.unitNames).map(s=>String(s||'').trim());
  const fromItems=[
    ...alive(DB.materials).map(m=>m.unit),
    ...alive(DB.purchases).map(p=>p.unit),
    ...serviceCatalog().map(s=>s.unit)
  ].map(s=>String(s||'').trim());
  const all=[...new Set([...BASE_UNITS, ...extra, ...fromItems].filter(Boolean))];
  all.sort((a,b)=>{
    if(a==='عدد') return -1;
    if(b==='عدد') return 1;
    return a.localeCompare(b,'fa');
  });
  return all;
}
function rememberUnit(u){
  u=String(u||'').trim();
  if(!u || u==='__new__') return 'عدد';
  const extra=parseJsonArr(DB.settings.unitNames);
  if(!BASE_UNITS.includes(u) && !extra.includes(u)){
    extra.push(u);
    DB.settings.unitNames=JSON.stringify(extra);
    settingsDirty=true;
    persistLocal();
  }
  return u;
}
function unitSelectHTML(id, selected){
  const cur=String(selected||'عدد').trim()||'عدد';
  const units=knownUnits();
  if(cur && !units.includes(cur)) units.unshift(cur);
  const opts=units.map(u=>`<option value="${esc(u)}" ${u===cur?'selected':''}>${esc(u)}</option>`).join('');
  return `<select class="inp" id="${id}" data-unit-sel="1">${opts}<option value="__new__">＋ واحد جدید…</option></select>`;
}
function bindUnitSelects(root){
  $$('[data-unit-sel]', root||document).forEach(sel=>{
    if(sel.dataset.bound==='1') return;
    sel.dataset.bound='1';
    sel.addEventListener('change', ()=>{
      if(sel.value!=='__new__'){ rememberUnit(sel.value); return; }
      const wrap=sel.closest('.field')||sel.parentElement;
      let extra=wrap.querySelector('.unit-new');
      if(!extra){
        extra=document.createElement('input');
        extra.className='inp unit-new';
        extra.setAttribute('autocomplete','off');
        extra.placeholder='نام واحد را بنویسید';
        wrap.appendChild(extra);
      }
      extra.value='';
      extra.focus();
      const commit=()=>{
        const u=(extra.value||'').trim();
        if(extra.parentNode) extra.remove();
        if(!u){ sel.value='عدد'; return; }
        rememberUnit(u);
        if(![...sel.options].some(o=>o.value===u)){
          const opt=document.createElement('option');
          opt.value=u; opt.textContent=u;
          const last=[...sel.options].find(o=>o.value==='__new__');
          sel.insertBefore(opt, last||null);
        }
        sel.value=u;
      };
      extra.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
      extra.onblur=()=>setTimeout(commit, 120);
    });
  });
}
function readUnit(id, fallback){
  const el=$(id);
  let u=el ? String(el.value||'').trim() : '';
  if(!u || u==='__new__'){
    const extra=el && el.closest('.field') && el.closest('.field').querySelector('.unit-new');
    u=extra ? String(extra.value||'').trim() : '';
  }
  return rememberUnit(u||fallback||'عدد');
}
function setUnitSelect(id, unit){
  const sel=$(id); if(!sel) return;
  const u=rememberUnit(unit||'عدد');
  if(![...sel.options].some(o=>o.value===u)){
    const opt=document.createElement('option');
    opt.value=u; opt.textContent=u;
    const last=[...sel.options].find(o=>o.value==='__new__');
    sel.insertBefore(opt, last||null);
  }
  sel.value=u;
}

function bindPurchases(){
  bindUnitSelects($('#view'));
  const live=(q,t,el)=>{
    const qty=num(q&&q.value), tot=num(t&&t.value);
    if(el) el.textContent = (qty>0 && tot>0) ? ('قیمت هر واحد: '+money(tot/qty)) : 'قیمت هر واحد: —';
  };
  if($('#buyQty')) $('#buyQty').oninput=$('#buyTotal').oninput=()=>live($('#buyQty'),$('#buyTotal'),$('#buyUnitLive'));
  if($('#svcQty')) $('#svcQty').oninput=()=>{
    const q=num($('#svcQty').value);
    if(num(window._svcRate)>0 && $('#svcTotal')) $('#svcTotal').value=Math.round(num(window._svcRate)*q);
    live($('#svcQty'),$('#svcTotal'),$('#svcUnitLive'));
    if(num(window._svcRate)>0 && $('#svcUnitLive')) $('#svcUnitLive').textContent='نرخ نرخنامه هر واحد: '+money(window._svcRate);
  };
  if($('#svcTotal')) $('#svcTotal').oninput=()=>live($('#svcQty'),$('#svcTotal'),$('#svcUnitLive'));
  const matItems=()=>alive(DB.materials).map(m=>({
    label: m.name+(m.unit?' — '+m.unit:''),
    name:m.name, unit:m.unit||'عدد', id:m.id
  }));
  const svcItems=()=>serviceCatalog().map(t=>({
    label:t.name+(t.unit?' — '+t.unit:'')+(num(t.price)?' · '+money(t.price):'')+(t.note?' · '+t.note:''),
    name:t.name, unit:t.unit||'عدد', price:num(t.price)
  }));
  const pickMat=it=>{
    if($('#buyName')) $('#buyName').value=it.name;
    if(it.unit) setUnitSelect('#buyUnit', it.unit);
  };
  const pickSvc=it=>{
    if($('#svcTitle')) $('#svcTitle').value=it.name;
    if(it.unit) setUnitSelect('#svcUnit', it.unit);
    window._svcRate=num(it.price);
    if(window._svcRate>0){
      const q=num($('#svcQty')&&$('#svcQty').value);
      if(q>0 && $('#svcTotal')) $('#svcTotal').value=Math.round(window._svcRate*q);
      if($('#svcUnitLive')) $('#svcUnitLive').textContent='نرخ نرخنامه هر واحد: '+money(window._svcRate);
    }
  };
  const openMats=()=>fillSugList($('#buyMatSug'), matItems(), pickMat);
  const openSvcs=()=>fillSugList($('#svcSug'), svcItems(), pickSvc);
  if($('#buyMenu')) $('#buyMenu').onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    const el=$('#buyMatSug');
    if(el && el.classList.contains('open')) el.classList.remove('open');
    else openMats();
    const s=$('#svcSug'); if(s) s.classList.remove('open');
  };
  if($('#svcMenu')) $('#svcMenu').onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    const el=$('#svcSug');
    if(el && el.classList.contains('open')) el.classList.remove('open');
    else openSvcs();
    const s=$('#buyMatSug'); if(s) s.classList.remove('open');
  };
  if($('#buyName')) $('#buyName').onclick=e=>{ e.stopPropagation(); openMats(); };
  if($('#svcTitle')) $('#svcTitle').onclick=e=>{ e.stopPropagation(); openSvcs(); };
  if($('#togNewMat')) $('#togNewMat').onclick=()=>{
    $('#newMatBox').classList.toggle('open');
    $('#togNewMat').classList.toggle('on');
    if($('#buyMatSug')) $('#buyMatSug').classList.remove('open');
    if($('#newMatBox').classList.contains('open') && $('#nmName')) $('#nmName').focus();
  };
  if($('#togNewSvc')) $('#togNewSvc').onclick=()=>{
    $('#newSvcBox').classList.toggle('open');
    $('#togNewSvc').classList.toggle('on');
    if($('#svcSug')) $('#svcSug').classList.remove('open');
    if($('#newSvcBox').classList.contains('open') && $('#nsTitle')) $('#nsTitle').focus();
  };
  if($('#saveNewMatQuick')) $('#saveNewMatQuick').onclick=()=>{
    const name=($('#nmName').value||'').trim();
    const unit=readUnit('#nmUnit','عدد');
    if(!name){ toast('نام کالا لازم است',false); return; }
    let mat=alive(DB.materials).find(m=>String(m.name).trim()===name);
    if(!mat){
      mat={id:uid('mat'), name, unit, unitCost:0, notes:'', deleted:'0'};
      upsertLocal('materials',mat);
      flush();
    }
    pickMat(mat);
    $('#newMatBox').classList.remove('open');
    $('#togNewMat').classList.remove('on');
    $('#nmName').value='';
    toast('به فهرست کالاها اضافه شد');
  };
  if($('#saveNewSvcQuick')) $('#saveNewSvcQuick').onclick=()=>{
    const unit=readUnit('#nsUnit','عدد');
    const title=addServiceToCatalog($('#nsTitle').value, unit);
    if(!title){ toast('عنوان خدمت لازم است',false); return; }
    pickSvc({name:title, unit});
    $('#newSvcBox').classList.remove('open');
    $('#togNewSvc').classList.remove('on');
    $('#nsTitle').value='';
    flush();
    toast('به فهرست خدمات اضافه شد');
  };
  const recBuy=({kind,title,materialId,qty,total,unit})=>{
    upsertLocal('purchases',{
      id:uid('buy'), kind, title, materialId:materialId||'', qty, totalAmount:total,
      unitPrice: qty>0? total/qty : total, unit:unit||'عدد',
      dateShamsi:shamsiShort(), dateGregorian:nowIso(), notes:'', deleted:'0'
    });
    flush();
  };
  if($('#saveBuyMat')) $('#saveBuyMat').onclick=async()=>{
    const name=($('#buyName').value||'').trim();
    const qty=num($('#buyQty').value), total=num($('#buyTotal').value), unit=readUnit('#buyUnit','عدد');
    if(!name){ toast('نام کالا لازم است',false); return; }
    if(!(qty>0) || !(total>0)){ toast('تعداد و مبلغ کل را وارد کنید',false); return; }
    const unitPrice=total/qty;
    let mat=alive(DB.materials).find(m=>String(m.name).trim()===name);
    if(mat){
      if(Math.abs(num(mat.unitCost)-unitPrice)>0.5){
        const ok=await priceChangeConfirm({name, oldPrice:num(mat.unitCost), newPrice:unitPrice});
        if(!ok) return;
        mat.unitCost=unitPrice;
      }
      if(unit && mat.unit!==unit) mat.unit=unit;
      upsertLocal('materials',mat);
    }else{
      mat={id:uid('mat'), name, unit, unitCost:unitPrice, notes:'خرید ثبت‌شده', deleted:'0'};
      upsertLocal('materials',mat);
    }
    recBuy({kind:'material', title:name, materialId:mat.id, qty, total, unit});
    toast('خرید کالا ثبت شد'); render();
  };
  if($('#saveBuySvc')) $('#saveBuySvc').onclick=async()=>{
    let title=($('#svcTitle').value||'').trim();
    const qty=num($('#svcQty').value), total=num($('#svcTotal').value);
    if(!title){ toast('عنوان خدمت لازم است',false); return; }
    if(!title.startsWith('خدمات')) title='خدمات '+title;
    if(!(qty>0) || !(total>0)){ toast('تعداد و مبلغ کل را وارد کنید',false); return; }
    const unitPrice=total/qty;
    const prev=alive(DB.purchases).filter(p=>p.kind==='service' && p.title===title)
      .sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
    if(prev && Math.abs(num(prev.unitPrice)-unitPrice)>0.5){
      const ok=await priceChangeConfirm({name:title, oldPrice:num(prev.unitPrice), newPrice:unitPrice});
      if(!ok) return;
    }
    const unit=readUnit('#svcUnit', (prev&&prev.unit)||'عدد');
    addServiceToCatalog(title, unit);
    recBuy({kind:'service', title, qty, total, unit});
    toast('پرداخت خدمات ثبت شد'); render();
  };
  $$('[data-del-buy]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('حذف سند','این خرید/پرداختی حذف شود؟')) return;
    const rec=byId(DB.purchases,b.dataset.delBuy); rec.deleted='1'; upsertLocal('purchases',rec); render();
  });
}

function periodStart(key){
  const d=new Date();
  if(key==='1W') d.setDate(d.getDate()-7);
  else if(key==='1M') d.setMonth(d.getMonth()-1);
  else if(key==='1Y') d.setFullYear(d.getFullYear()-1);
  else return new Date(2000,0,1);
  return d;
}
function viewAccounting(){
  const per = (window._accPer)||'ALL';
  const from=periodStart(per).getTime();
  const orders=alive(DB.orders).filter(o=>new Date(o.dateGregorian||o.createdAt).getTime()>=from);
  const pays=alive(DB.payments).filter(p=>new Date(p.dateGregorian||p.createdAt).getTime()>=from);
  const buys=alive(DB.purchases).filter(p=>new Date(p.dateGregorian||p.createdAt).getTime()>=from);
  const sale=orders.reduce((s,o)=>s+orderFinancials(o).sale,0);
  const rec=pays.reduce((s,p)=>s+num(p.amount),0);
  const expense=buys.reduce((s,p)=>s+num(p.totalAmount),0);
  const net=rec-expense;
  let remain=0;
  alive(DB.customers).forEach(c=>{ remain += ledger(c.id).debt; });
  const tx=[
    ...orders.map(o=>({t:o.dateGregorian,d:shamsiOf(o),k:'فروش',n:o.customerName,inv:o.invoiceNo,a:orderFinancials(o).sale,id:o.id,kind:'o'})),
    ...pays.map(p=>{
      const c=byId(DB.customers,p.customerId);
      return {t:p.dateGregorian,d:shamsiOf(p),k:'دریافت',n:(c?c.name:'مشتری'),inv:'',a:num(p.amount),note:p.method||'',id:p.id,kind:'p'};
    }),
    ...buys.map(p=>({t:p.dateGregorian,d:shamsiOf(p),k:p.kind==='service'?'هزینه خدمات':'خرید کالا',n:p.title,inv:'',a:-num(p.totalAmount),id:p.id,kind:'b'}))
  ].sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  const trows=tx.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.k)}</td><td>${esc(x.n||'')}</td><td>${esc(x.inv||'')}</td><td>${money(x.a)}</td><td>${esc(x.note||'')}</td>
    <td>${x.kind==='p'?`<button type="button" class="btn btn-d" data-del-pay="${x.id}">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">تراکنشی نیست.</td></tr>';
  const crows=alive(DB.customers).map(c=>{
    const L=ledger(c.id);
    return `<tr class="clickable" data-open-cus="${c.id}"><td>${esc(c.name)}</td><td>${money(L.totalSale)}</td><td>${money(L.totalPaid)}</td><td>${money(L.debt)}</td></tr>`;
  }).join('')||'<tr><td colspan="4" class="empty">مشتری‌ای نیست.</td></tr>';
  return `<div class="pf-head">
    <button class="btn btn-g" data-go="dashboard">⌂ صفحه اصلی</button>
    <div class="pf-head-meta"><h1>حسابداری</h1><p>پرتفوی مالی و گزارش تراکنش‌ها</p></div>
  </div>
  <div class="accounting-range">${[['1W','1W'],['1M','1M'],['1Y','1Y'],['ALL','ALL']].map(([k,l])=>`<button class="chip ${per===k?'on':''}" data-per="${k}">${l}</button>`).join('')}<button class="btn btn-g" id="accCsv" style="margin-inline-start:auto">⇩ خروجی Excel (CSV)</button></div>
  <section class="portfolio-stats">
    <div><small>مجموع فروش ثبت‌شده</small><b>${money(sale)}</b></div>
    <div><small>دریافتی‌ها</small><b>${money(rec)}</b></div>
    <div><small>خرید و هزینه‌ها</small><b>${money(expense)}</b></div>
    <div><small>درآمد خالص</small><b>${money(net)}</b></div>
    <div class="debt"><small>مطالبات باقی‌مانده</small><b>${money(remain)}</b></div>
  </section>
  <section class="card"><h2>تراکنش‌ها</h2>
    <div class="table-wrap"><table class="cart-table"><thead><tr><th>تاریخ</th><th>نوع تراکنش</th><th>مشتری</th><th>شماره سفارش</th><th>مبلغ</th><th>توضیحات</th><th>عملیات</th></tr></thead><tbody>${trows}</tbody></table></div>
  </section>
  <section class="card"><h2>پرتفوی مشتریان</h2>
    <div class="table-wrap"><table class="cart-table"><thead><tr><th>مشتری</th><th>کل سفارش‌ها</th><th>پرداختی‌ها</th><th>بدهی</th></tr></thead><tbody>${crows}</tbody></table></div>
  </section>`;
}

let LOGO_DATA='', LOGO_PY_DATA='';
function imgToData(src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');
        c.width=img.naturalWidth||1; c.height=img.naturalHeight||1;
        c.getContext('2d').drawImage(img,0,0);
        const d=c.toDataURL('image/png');
        if(d && d.length>100) return res(d);
      }catch(e){}
      fetch(src).then(r=>r.blob()).then(b=>{
        const fr=new FileReader();
        fr.onload=()=>res(String(fr.result||''));
        fr.onerror=()=>res('');
        fr.readAsDataURL(b);
      }).catch(()=>res(''));
    };
    img.onerror=()=>res('');
    img.src=src;
  });
}
async function ensureLogoData(){
  if(LOGO_DATA && LOGO_PY_DATA) return;
  const [a,b]=await Promise.all([imgToData(logoUrl('logo.png')), imgToData(logoUrl('logo-py.png'))]);
  if(a) LOGO_DATA=a;
  if(b) LOGO_PY_DATA=b;
}
function inlineLogos(root){
  $$('img', root||document).forEach(img=>{
    const src=String(img.getAttribute('src')||'').split('?')[0];
    if(src==='logo.png' && LOGO_DATA) img.src=LOGO_DATA;
    else if(src==='logo-py.png' && LOGO_PY_DATA) img.src=LOGO_PY_DATA;
  });
}
/* هر خروجیِ canvas ابتدا روی زمینهٔ سفید ترکیب می‌شود؛
   در غیر این صورت بخش‌های شفاف (مثل لوگو) در JPEG سیاه می‌شوند */
async function renderA4Canvas(el, scale){
  const canvas=await window.html2canvas(el,{scale:scale||2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  const flat=document.createElement('canvas');
  flat.width=canvas.width; flat.height=canvas.height;
  const cx=flat.getContext('2d');
  cx.fillStyle='#ffffff';
  cx.fillRect(0,0,flat.width,flat.height);
  cx.drawImage(canvas,0,0);
  return flat;
}
async function buildA4Pdf(html){
  if(!window.html2canvas) throw new Error('html2canvas');
  if(!(window.jspdf && window.jspdf.jsPDF)) throw new Error('jspdf');
  await ensureLogoData();
  const hold=document.createElement('div');
  hold.style.cssText='position:fixed;left:-10000px;top:0;';
  hold.innerHTML=html;
  document.body.appendChild(hold);
  inlineLogos(hold);
  try{
    const jsPDF=window.jspdf.jsPDF;
    const pages=[...hold.querySelectorAll('.a4')];
    if(!pages.length) throw new Error('empty');
    const r0=pages[0].getBoundingClientRect();
    const orient=(r0.width>r0.height)?'landscape':'portrait';
    const pdf=new jsPDF({orientation:orient, unit:'mm', format:'a4', compress:true});
    for(let i=0;i<pages.length;i++){
      const flat=await renderA4Canvas(pages[i], 3);
      if(i) pdf.addPage('a4', orient);
      const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
      pdf.addImage(flat.toDataURL('image/png'),'PNG',0,0,pw,ph,'p'+i,'FAST');
    }
    return pdf;
  } finally { hold.remove(); }
}
async function downloadA4Pdf(html, baseName){
  try{
    const pdf=await buildA4Pdf(html);
    pdf.save(baseName+'.pdf');
    toast('فایل PDF آماده شد');
  }catch(e){
    toast('ساخت PDF ممکن نشد', false);
  }
}

   اگر فاکتور تغییری نکرده باشد، همان فایل قبلی استفاده می‌شود */
function invoiceSig(o){
  return [o.updatedAt||'', bankIban(), bankCard(), bankAccount(), sellerName(), sellerPhone()].join('|');
}
async function invoicePdfLink(o){
  if(o.pdfUrl && o.pdfSig===invoiceSig(o)) return o.pdfUrl;
  if(!navigator.onLine) throw new Error('offline');
  const pdf=await buildA4Pdf(invoicePagesHTML(o));
  const b64=pdf.output('datauristring').split(',')[1];
  const r=await api('savePdf', {invoiceNo:String(o.invoiceNo||''), data:b64}, 120000, 0);
  if(!r || !r.ok || !r.url) throw new Error((r&&r.error)||'savePdf');
  o.pdfUrl=r.url; o.pdfId=r.id||'';
  upsertLocal('orders', o);
  o.pdfSig=invoiceSig(o);
  persistLocal();
  flush();
  return r.url;
}
function copyText(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  }catch(e){}
  return new Promise((res,rej)=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99999);
      const ok=document.execCommand('copy');
      ta.remove();
      ok?res():rej(new Error('copy'));
    }catch(e){ rej(e); }
  });
}

/* ==================== گزارش‌ها ==================== */
function monthKeyOf(o){
  const m=shamsiOf(o).match(/^(\d{3,4})[\/\-](\d{1,2})/);
  if(m) return m[1]+'/'+String(m[2]).padStart(2,'0');
  const d=new Date((o&&(o.dateGregorian||o.createdAt))||'');
  if(isNaN(d.getTime())) return '';
  const j=g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0');
}
function monthLabel(k){
  const p=String(k).split('/');
  const mi=Math.max(1, Math.min(12, num(p[1])));
  return (JM[mi-1]||'')+' '+faDigits(String(p[0]||'').slice(2));
}
function viewReports(){
  const per=(window._repPer)||'ALL';
  const from=periodStart(per).getTime();
  const orders=alive(DB.orders).filter(o=>new Date(o.dateGregorian||o.createdAt).getTime()>=from);
  const pays=alive(DB.payments).filter(p=>new Date(p.dateGregorian||p.createdAt).getTime()>=from);
  const buys=alive(DB.purchases).filter(p=>new Date(p.dateGregorian||p.createdAt).getTime()>=from);
  const sale=orders.reduce((s,o)=>s+orderFinancials(o).sale,0);
  const profit=orders.reduce((s,o)=>s+orderFinancials(o).profit,0);
  const mat=orders.reduce((s,o)=>s+orderFinancials(o).material,0);
  const expense=buys.reduce((s,p)=>s+num(p.totalAmount),0);
  const rec=pays.reduce((s,p)=>s+num(p.amount),0);
  let debt=0; alive(DB.customers).forEach(c=>{ debt+=ledger(c.id).debt; });
  const avg=orders.length?Math.round(sale/orders.length):0;

  const buckets=new Map();
  orders.forEach(o=>{
    const k=monthKeyOf(o); if(!k) return;
    const b=buckets.get(k)||{sale:0,profit:0,n:0};
    const f=orderFinancials(o); b.sale+=f.sale; b.profit+=f.profit; b.n++;
    buckets.set(k,b);
  });
  const keys=[...buckets.keys()].sort().slice(-12);
  const maxV=Math.max(1, ...keys.map(k=>buckets.get(k).sale));
  const bars=keys.length ? keys.map(k=>{
    const b=buckets.get(k);
    const h1=Math.max(2, Math.round(b.sale/maxV*130));
    const h2=Math.max(2, Math.round(Math.max(0,b.profit)/maxV*130));
    return `<div class="rep-col" title="${esc(monthLabel(k))} — فروش ${money(b.sale)} / سود ${money(b.profit)}">
      <div class="rep-stack"><div class="bar" style="height:${h1}px"></div><div class="bar alt" style="height:${h2}px"></div></div>
      <small>${esc(monthLabel(k))}</small></div>`;
  }).join('') : '<div class="soc-empty">داده‌ای در این بازه ثبت نشده است.</div>';

  const pmap=new Map();
  orders.forEach(o=>orderItems(o.id).forEach(it=>{
    const key=String(it.productCode||'')+'|'+String(it.productName||'');
    const b=pmap.get(key)||{code:it.productCode,name:it.productName,qty:0,sale:0,profit:0};
    b.qty+=num(it.qty); b.sale+=num(it.saleAmount);
    b.profit+= num(it.profit) || (num(it.saleAmount)-num(it.materialCost)*num(it.qty));
    pmap.set(key,b);
  }));
  const topP=[...pmap.values()].sort((a,b)=>b.sale-a.sale).slice(0,10);
  const prows=topP.map((p,i)=>`<tr><td>${faDigits(i+1)}</td><td>${esc(p.code||'—')}</td><td>${esc(p.name)}</td><td>${faDigits(num(p.qty))}</td><td>${money(p.sale)}</td><td>${money(p.profit)}</td></tr>`).join('')
    || '<tr><td colspan="6" class="empty">فروشی در این بازه ثبت نشده.</td></tr>';

  const clist=alive(DB.customers).map(c=>({c,L:ledger(c.id)})).filter(x=>x.L.totalSale>0)
    .sort((a,b)=>b.L.totalSale-a.L.totalSale).slice(0,10);
  const crows=clist.map((x,i)=>`<tr class="clickable" data-open-cus="${x.c.id}"><td>${faDigits(i+1)}</td><td>${esc(x.c.name)}</td><td>${esc(x.c.phone||'—')}</td><td>${money(x.L.totalSale)}</td><td>${money(x.L.totalPaid)}</td><td>${money(x.L.debt)}</td></tr>`).join('')
    || '<tr><td colspan="6" class="empty">مشتری‌ای ثبت نشده.</td></tr>';

  window._repExport={per:per, orders:orders, sale:sale, profit:profit, mat:mat, expense:expense, rec:rec, debt:debt, topP:topP, clist:clist};

  return `<div class="pf-head">
    <button class="btn btn-g" data-go="dashboard">⌂ صفحه اصلی</button>
    <div class="pf-docs"><button type="button" id="repCsv" title="خروجی Excel (CSV)">⇩</button></div>
    <div class="pf-head-meta"><h1>گزارش‌ها</h1><p>فروش، سود، مشتریان و محصولات</p></div>
  </div>
  <div class="accounting-range">${[['1W','1W'],['1M','1M'],['1Y','1Y'],['ALL','ALL']].map(([k,l])=>`<button class="chip ${per===k?'on':''}" data-rep="${k}">${l}</button>`).join('')}</div>
  <section class="portfolio-stats">
    <div><small>تعداد سفارش</small><b>${faDigits(orders.length)}</b></div>
    <div><small>مجموع فروش</small><b>${money(sale)}</b></div>
    <div><small>سود ناخالص</small><b>${money(profit)}</b></div>
    <div><small>خرید و هزینه‌ها</small><b>${money(expense)}</b></div>
    <div><small>دریافتی‌ها</small><b>${money(rec)}</b></div>
    <div class="debt"><small>مطالبات</small><b>${money(debt)}</b></div>
    <div><small>میانگین سفارش</small><b>${money(avg)}</b></div>
  </section>
  <section class="card"><h3>روند فروش و سود ماهانه</h3>
    <div class="rep-bars">${bars}</div>
    <div class="rep-legend"><span><i></i> فروش</span><span><i class="alt"></i> سود ناخالص</span><span>هزینه مواد این بازه: ${money(mat)}</span></div>
  </section>
  <div class="grid-2">
    <section class="card"><h3>پرفروش‌ترین محصولات</h3>
      <div class="table-wrap"><table class="cart-table"><thead><tr><th>#</th><th>کد</th><th>محصول</th><th>تعداد</th><th>فروش</th><th>سود</th></tr></thead><tbody>${prows}</tbody></table></div>
    </section>
    <section class="card"><h3>برترین مشتریان</h3>
      <div class="table-wrap"><table class="cart-table"><thead><tr><th>#</th><th>مشتری</th><th>تماس</th><th>خرید</th><th>پرداخت</th><th>مانده</th></tr></thead><tbody>${crows}</tbody></table></div>
    </section>
  </div>`;
}

    location.reload();

  d.recipientName=o.recipientName||''; d.socialId=o.socialId||''; d.phone=o.phone||'';
  d.address=o.address||''; d.postalCode=o.postalCode||''; d.dateShamsi=o.dateShamsi||shamsiShort();
  d.shippingMethod=o.shippingMethod||'پست'; d.shippingCost=num(o.shippingCost);
  d.trackingCode=o.trackingCode||''; d.notes=o.notes||''; d.stage=num(o.stage)||1;
  d.items=socItems(o); d.pays=socPays(o);
  return d;
}
function socItems(o){ try{ const v=JSON.parse(o&&o.itemsJson||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function socPays(o){ try{ const v=JSON.parse(o&&o.paymentsJson||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function nextSocialNo(){
  let n=num(DB.settings.socialCounter)||1;
  alive(DB.socialOrders).forEach(o=>{
    const m=String(o.invoiceNo||'').match(/(\d+)\s*$/);
    if(m){ const x=num(m[1]); if(x>=n) n=x+1; }
  });
  return 'S-'+n;
}
function socProfitOf(d){
  const items=(d.items||[]);
  const products=items.reduce((s,i)=>s+num(i.qty)*num(i.unitPrice),0);
  const mat=items.reduce((s,i)=>{
    const p=alive(DB.products).find(x=>String(x.name)===String(i.name));
    return s + (p?productCost(p):num(i.materialCost))*num(i.qty);
  },0);
  const ship=num(d.shippingCost);
  const paid=(d.pays||[]).reduce((s,p)=>s+num(p.amount),0);
  return {products:products, mat:mat, ship:ship, paid:paid, profit:products-mat-ship, remain:products+ship-paid};
}
function socTotals(o){ return socProfitOf({items:socItems(o), pays:socPays(o), shippingCost:o.shippingCost}); }

function productReportPages(ids, mode){
  const list=ids.map(id=>byId(DB.products,id)).filter(Boolean)

  const rowHTML=(p,idx)=>{
    const cost=productCost(p), sale=productSale(p), pct=productProfitPct(p,cost);
    return detail
      ? `<tr>
          <td class="c">${faDigits(idx+1)}</td>

          <td class="c">${faDigits(idx+1)}</td>
          <td class="c">${faDigits(p.code||'')}</td>
          <td>${esc(p.name)}</td>

  /* ---- مرحله ۱: اندازه‌گیری واقعی ---- */
  let heights=new Array(list.length).fill(24);
  let avail=760;
  try{
    const stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:-12000px;top:0;width:'+(land?'297mm':'210mm')+';visibility:hidden;pointer-events:none';
    stage.innerHTML=pageOf(list.map((p,i)=>rowHTML(p,i)), 0, 1);
    document.body.appendChild(stage);
    const sec=stage.firstElementChild;
    const cs=getComputedStyle(sec);
    const padT=parseFloat(cs.paddingTop)||0, padB=parseFloat(cs.paddingBottom)||0;
    const a4H=parseFloat(cs.minHeight)||1123;
    const h=el=>el?el.getBoundingClientRect().height:0;
    const chrome=h(sec.querySelector('.inv-top'))+h(sec.querySelector('thead'))+h(sec.querySelector('.inv-sign'));
    avail=Math.max(200, a4H-padT-padB-chrome-26);  /* حاشیهٔ اطمینان */
    heights=[...sec.querySelectorAll(':scope > table > tbody > tr')].map(tr=>tr.getBoundingClientRect().height);
    stage.remove();
  }catch(e){}

  /* ---- مرحله ۲: تقسیم بین صفحه‌ها ---- */
  const chunks=[]; let cur=[], used=0;
  for(let i=0;i<list.length;i++){
    const rh=heights[i]||24;
    if(cur.length && used+rh>avail){ chunks.push(cur); cur=[]; used=0; }
    cur.push(i); used+=rh;
  }
  if(cur.length) chunks.push(cur);
  if(!chunks.length) chunks.push([]);
  const total=chunks.length;
  let startIdx=0;
  return chunks.map((ch,i)=>{
    const fixed=ch.map((k,j)=>rowHTML(list[k], startIdx+j));
    startIdx+=ch.length;
    return pageOf(fixed, i, total);
  }).join('');
}
async function a4DownloadZip(html, baseName){
  if(!window.html2canvas){ toast('کتابخانه تصویر در دسترس نیست', false); return; }
  await ensureLogoData();
  const hold=document.createElement('div');
  hold.style.cssText='position:fixed;left:-10000px;top:0;';
  hold.innerHTML=html;
  document.body.appendChild(hold);
  inlineLogos(hold);
  const pages=[...hold.querySelectorAll('.a4')];
  try{
    if(window.JSZip && pages.length>1){
      const zip=new JSZip();
      for(let i=0;i<pages.length;i++){
        const flat=await renderA4Canvas(pages[i], 2);
        zip.file(`${baseName}-p${i+1}.png`, flat.toDataURL('image/png').split(',')[1], {base64:true});
      }
      const blob=await zip.generateAsync({type:'blob'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=baseName+'.zip'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    }else{
      const flat=await renderA4Canvas(pages[0], 2);
      const a=document.createElement('a');
      a.href=flat.toDataURL('image/png'); a.download=baseName+'.png'; a.click();
    }
    toast('فایل آماده شد');
  }catch(e){ toast('ساخت تصویر ممکن نشد', false); }
  hold.remove();
}

  document.addEventListener('submit', ev=>{
    if(ev.target && ev.target.id==='cusAddForm'){
      ev.preventDefault();
      const c=addCustomer($('#nName')&&$('#nName').value, $('#nPhone')&&$('#nPhone').value, $('#nAddr')&&$('#nAddr').value);
      if(c) render();
    }
  });
  document.addEventListener('click', ev=>{
    if(ev.target.closest('#cSearch') || ev.target.closest('#cSug')) return;
    if(ev.target.closest('#pSearch') || ev.target.closest('#pSug')) return;
    if(ev.target.closest('#buyName') || ev.target.closest('#buyMatSug') || ev.target.closest('#buyMenu')) return;
    if(ev.target.closest('#svcTitle') || ev.target.closest('#svcSug') || ev.target.closest('#svcMenu')) return;
    ['#cSug','#pSug','#buyMatSug','#svcSug'].forEach(id=>{ const el=$(id); if(el) el.classList.remove('open'); });
  });
  tick(); setInterval(tick,1000);
  window.addEventListener('online',()=>{ renderStatus(); if(ready) flush(); });
  window.addEventListener('offline',()=>{ lastError='اتصال اینترنت قطع است.'; renderStatus(); toast('اتصال اینترنت قطع است',false); });
  loadLocal();
  try{ repairDates(); }catch(e){}
  ready=true;
  const lk=$('#lock'); if(lk) lk.classList.add('hide');
  if(!openFromHash()) render();
  bootstrap().then(()=>{ lastError=''; try{ repairDates(); }catch(e){} openFromHash(); render(); }).catch(e=>{
    lastError = navigator.onLine ? (e.message||'خطای بکاپ') : 'آفلاین';
    renderStatus();
  });
  setInterval(()=>{ if(ready) flush(); }, 30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && ready) flush(); });
}
boot();
</script>
